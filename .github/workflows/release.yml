name: Release Windows x64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Microsoft Build of OpenJDK 17 (Microsoft-signed JRE binaries)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'microsoft'
          java-version: '17'
          cache: 'maven'

      - name: Restore NuGet packages (locked mode)
        run: dotnet restore src/TV/TV.csproj --locked-mode

      - name: Prepare optional Authenticode certificate
        id: cert
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGN_PFX_BASE64)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "release-sign.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            "pfx_path=$pfxPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "has_cert=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "has_cert=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Download previous release for incremental package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content 'Directory.Build.props' -Raw)).Project.PropertyGroup.Version
          $releases = gh release list --exclude-drafts --exclude-pre-releases --limit 25 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Failed to list previous releases' }
          $previous = $releases | ConvertFrom-Json | ForEach-Object { $_ } |
            Where-Object { $_.tagName -match '^v\d+\.\d+\.\d+$' -and [version]$_.tagName.Substring(1) -lt [version]$version } |
            Sort-Object { [version]$_.tagName.Substring(1) } -Descending | Select-Object -First 1 -ExpandProperty tagName
          if ($previous) {
            New-Item -ItemType Directory -Force 'artifacts/prerequisites/update-base' | Out-Null
            gh release download $previous --pattern '*-win-x64-portable.zip' --dir 'artifacts/prerequisites/update-base' --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to download incremental base package' }
          }

      - name: Build installer and portable package
        shell: pwsh
        env:
          DANDANPLAY_RELAY_URL: ${{ vars.DANDANPLAY_RELAY_URL }}
          TV_SIGN_PFX: ${{ steps.cert.outputs.pfx_path }}
          TV_SIGN_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $relay = $null
          if (-not [uri]::TryCreate($env:DANDANPLAY_RELAY_URL, [UriKind]::Absolute, [ref]$relay) -or
              $relay.Scheme -ne 'https' -or -not $relay.IsDefaultPort -or $relay.IsLoopback -or
              $relay.UserInfo -or $relay.PathAndQuery -ne '/' -or $relay.Fragment) {
            throw 'DANDANPLAY_RELAY_URL must be a public HTTPS origin.'
          }
          pwsh -NoProfile -File ./scripts/build-installer.ps1 -NoRestore

      - name: Verify installer fast-launch non-regression gate
        shell: pwsh
        run: |
          $version = ([xml](Get-Content 'Directory.Build.props' -Raw)).Project.PropertyGroup.Version
          $setup = "artifacts/installers/TV-Setup-$version-x64.exe"
          pwsh -NoProfile -File ./scripts/Test-InstallerLaunchSpeed.ps1 -InstallerPath $setup -AssertIssSettings -Runs 2 -MaxColdMs 3500 -MaxWarmMs 1200

      - name: Clean temporary signing certificate
        if: always() && steps.cert.outputs.has_cert == 'true'
        shell: pwsh
        run: |
          if (Test-Path "${{ steps.cert.outputs.pfx_path }}") {
            Remove-Item -LiteralPath "${{ steps.cert.outputs.pfx_path }}" -Force
          }

      - name: Generate GitHub Build Provenance Attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/installers/TV-Setup-*-x64.exe
            artifacts/installers/TV-*-win-x64-portable.zip
            artifacts/installers/TV-Update-*-x64.exe
            artifacts/installers/TV-Update-*-x64.exe.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: liuguang-cinema-win-x64
          path: |
            artifacts/installers/TV-Setup-*-x64.exe
            artifacts/installers/TV-Setup-*-x64.exe.sha256
            artifacts/installers/TV-*-win-x64-portable.zip
            artifacts/installers/TV-Update-*-x64.exe
            artifacts/installers/TV-Update-*-x64.exe.sha256
            artifacts/installers/TV-*-win-x64-portable.zip.sha256
