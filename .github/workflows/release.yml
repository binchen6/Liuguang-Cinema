name: Release Windows x64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Microsoft Build of OpenJDK 17 (Microsoft-signed JRE binaries)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'microsoft'
          java-version: '17'
          cache: 'maven'

      - name: Restore NuGet packages (locked mode)
        run: dotnet restore src/TV/TV.csproj --locked-mode

      - name: Prepare optional Authenticode certificate
        id: cert
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGN_PFX_BASE64)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "release-sign.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            "pfx_path=$pfxPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "has_cert=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "has_cert=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Build installer
        shell: pwsh
        env:
          DANDANPLAY_RELAY_URL: ${{ vars.DANDANPLAY_RELAY_URL }}
          TV_SIGN_PFX: ${{ steps.cert.outputs.pfx_path }}
          TV_SIGN_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $rawRelays = if ($env:DANDANPLAY_RELAY_URL) { $env:DANDANPLAY_RELAY_URL } else { '' }
          $relayEntries = @($rawRelays -split '[,;]' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if ($relayEntries.Count -eq 0) {
            throw 'DANDANPLAY_RELAY_URL must contain one or more public HTTPS relay URLs.'
          }
          foreach ($entry in $relayEntries) {
            $relay = $null
            if (-not [uri]::TryCreate($entry, [UriKind]::Absolute, [ref]$relay) -or
                $relay.Scheme -ne 'https' -or -not $relay.IsDefaultPort -or $relay.IsLoopback -or
                $relay.UserInfo -or $relay.Query -or $relay.Fragment -or
                $relay.AbsolutePath.Length -gt 64 -or $relay.AbsolutePath.Contains('..')) {
              throw "Invalid DANDANPLAY_RELAY_URL entry: $entry (must be a public HTTPS URL without query/fragment)."
            }
          }
          pwsh -NoProfile -File ./scripts/build-installer.ps1 -NoRestore -ForceFullUpdate

      - name: Verify installer fast-launch non-regression gate
        shell: pwsh
        run: |
          $version = ([xml](Get-Content 'Directory.Build.props' -Raw)).Project.PropertyGroup.Version
          $setup = "artifacts/installers/TV-Setup-$version-x64.exe"
          pwsh -NoProfile -File ./scripts/Test-InstallerLaunchSpeed.ps1 -InstallerPath $setup -AssertIssSettings -Runs 2 -MaxColdMs 3500 -MaxWarmMs 1200

      - name: Verify clean installation on Windows
        shell: pwsh
        run: |
          $version = ([xml](Get-Content 'Directory.Build.props' -Raw)).Project.PropertyGroup.Version
          $env:TV_DATA_ROOT = Join-Path $env:RUNNER_TEMP 'Liuguang release profile'
          $installed = Join-Path $env:RUNNER_TEMP 'Liuguang Cinema 中文'
          $setup = Get-Item -LiteralPath "artifacts/installers/TV-Setup-$version-x64.exe"
          function Test-InstallPackage($exe, $destination) {
            $log = Join-Path $env:RUNNER_TEMP ($exe.BaseName + '.log')
            $installerArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS',
              ('/DIR="{0}"' -f $destination), ('/LOG="{0}"' -f $log))
            $process = Start-Process -FilePath $exe.FullName -ArgumentList $installerArgs -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(180000)) {
              $process.Kill($true)
              throw "$($exe.Name) did not finish within 3 minutes"
            }
            if ($process.ExitCode -ne 0) {
              Get-Content -LiteralPath $log -Tail 20 -ErrorAction SilentlyContinue
              throw "$($exe.Name) failed with exit code $($process.ExitCode)"
            }
            $installedVersion = (Get-Item -LiteralPath (Join-Path $destination 'TV.dll')).VersionInfo.FileVersion
            if ($installedVersion -ne "$version.0") { throw "Unexpected installed version $installedVersion" }
          }
          Test-InstallPackage $setup $installed
          pwsh -NoProfile -File ./scripts/run-release-regressions.ps1 -AppDirectory $installed -VerifyBundledRuntimes
          if ($LASTEXITCODE -ne 0) { throw 'Installed application regression checks failed' }
          node --test server/dandanplay-relay/worker.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'DanDanPlay relay regression checks failed' }

      - name: Clean temporary signing certificate
        if: always() && steps.cert.outputs.has_cert == 'true'
        shell: pwsh
        run: |
          if (Test-Path "${{ steps.cert.outputs.pfx_path }}") {
            Remove-Item -LiteralPath "${{ steps.cert.outputs.pfx_path }}" -Force
          }

      - name: Generate GitHub Build Provenance Attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/installers/TV-Setup-*-x64.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: liuguang-cinema-win-x64
          path: |
            artifacts/installers/TV-Setup-*-x64.exe
            artifacts/installers/TV-Setup-*-x64.exe.sha256
